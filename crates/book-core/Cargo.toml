[package]
name = "book-core"
description = "Image processing pipeline that turns photos/scans of book pages into a clean PDF"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "tiff", "webp", "bmp", "gif", "rayon"] }
imageproc = { version = "0.27", default-features = false, features = ["rayon"] }
lopdf = { version = "0.45", default-features = false }
rayon = "1"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tract-onnx = "0.23"
